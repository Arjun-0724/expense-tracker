{% extends 'base.html' %}

{% block title %}
Add Budget
{% endblock %}

{% block content %}

<h1 class="mb-4">Add Budget</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit"
            class="btn btn-primary">
        Save Budget
    </button>

    <a href="{% url 'budget_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
