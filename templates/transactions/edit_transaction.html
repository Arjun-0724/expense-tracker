{% extends 'base.html' %}

{% block title %}
Edit Transaction
{% endblock %}

{% block content %}

<h2>Edit Transaction</h2>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit"
            class="btn btn-primary">
        Update
    </button>

    <a href="{% url 'transaction_list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
