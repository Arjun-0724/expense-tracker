<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}
        Expense Tracker
      {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Expense Tracker</a>

        <div class="ms-auto">
          {% if user.is_authenticated %}
            <span class="text-white me-3">{{ user.username }}</span>
            <a href="{% url 'home' %}" class="btn btn-success me-2">Dashboard</a>
            <a href="{% url 'transaction_list' %}" class="btn btn-info me-2">Transactions</a>
            <a href="/transactions/add/" class="btn btn-warning me-2">Add Transaction</a>
            <a href="{% url 'budget_list' %}" class="btn btn-warning me-2">Budgets</a>
            <a href="{% url 'report_view' %}" class="btn btn-info me-2">Reports</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger">Logout</button>
            </form>
          {% else %}
            <a class="btn btn-success me-2" href="/register/">Register</a>

            <a class="btn btn-primary" href="/accounts/login/">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}

      {% endblock %}
    </div>
  </body>
</html>
