<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
</head>
<body>

<h1>Expense Tracker</h1>

    <p>Welcome {{ user.username }}</p>

    <a href="/accounts/logout/">

    <a href="/register/">
        Register

    <br><br>

    <a href="/accounts/login/">
        Login
    </a>

{% endif %}

</body>
</html>
