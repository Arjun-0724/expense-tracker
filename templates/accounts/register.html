{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh; padding: 2rem 0;">
    <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 480px; border-radius: 12px; background-color: #ffffff;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Create Account</h2>
            <p class="text-muted small">Join us today! Please fill in your details to sign up.</p>
        </div>

        <form method="POST" class="needs-validation">
            {% csrf_token %}
            
            <div class="django-form-wrapper mb-3">
                {{ form.as_p }}
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-success btn-lg fs-6 py-2" style="border-radius: 8px;">
                    Register
                </button>
            </div>
        </form>

    </div>
</div>

<style>
    .django-form-wrapper p {
        margin-bottom: 1.25rem;
    }
    .django-form-wrapper label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: #495057;
        font-size: 0.9rem;
    }
    .django-form-wrapper input, 
    .django-form-wrapper select, 
    .django-form-wrapper textarea {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 8px;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }
    .django-form-wrapper input:focus,
    .django-form-wrapper select:focus,
    .django-form-wrapper textarea:focus {
        color: #212529;
        background-color: #fff;
        border-color: #198754; /* Green focus ring to match btn-success */
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, .25);
    }
    /* Simple support for helper text/errors if Django passes them */
    .django-form-wrapper .helptext {
        display: block;
        font-size: 0.8rem;
        color: #6c757d;
        margin-top: 0.25rem;
    }
    .django-form-wrapper .errorlist {
        list-style: none;
        padding-left: 0;
        color: #dc3545;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
    }
</style>
{% endblock %}
